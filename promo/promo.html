<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>BOAKO Promo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--p:#7c3aed;--pl:#a78bfa;--pd:#5b21b6;--dk:#1e0a3c;--ac:#f59e0b;--ac2:#fbbf24;--ink:#1e293b;--sub:#64748b;--bd:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:#000}
body{font-family:'Noto Sans KR','Noto Color Emoji',sans-serif;word-break:keep-all}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#5b21b6 0%,#3b0f80 45%,#1e0a3c 100%)}
.dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 34px 170px;opacity:0}
.scene.mid{justify-content:center;padding-top:60px}
.t{font-weight:900;color:#fff;text-align:center;line-height:1.22;letter-spacing:-1px;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.t1{font-size:46px}.t2{font-size:38px}.t3{font-size:30px}
.hl{color:var(--ac2)}
.sub{font-weight:700;color:#e9d5ff;font-size:22px;text-align:center;line-height:1.4;margin-top:14px}
.card{background:#fff;border-radius:26px;box-shadow:0 22px 50px rgba(0,0,0,.35);padding:22px;width:100%;color:var(--ink)}
.row{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:#fff;font-weight:900;font-size:22px;padding:10px 22px;border-radius:999px;box-shadow:0 8px 20px rgba(245,158,11,.4)}
.pill.pu{background:var(--p);box-shadow:0 8px 20px rgba(124,58,237,.5)}
.pill.wh{background:#fff;color:var(--pd);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.logo{font-weight:900;letter-spacing:-4px;color:#fff;line-height:1}
.note{position:absolute;bottom:150px;left:0;right:0;text-align:center;color:rgba(255,255,255,.45);font-size:13px;font-weight:700}
.big{font-size:84px}
.emo{font-family:'Noto Color Emoji'}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.cell{aspect-ratio:1;border-radius:10px;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--pd)}
.cell.on{background:var(--p);color:#fff}
.cell.on2{background:var(--ac);color:#fff}
.bar{height:16px;border-radius:99px;background:#ede9fe;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),#c084fc);transform-origin:left}
.tag{font-size:15px;font-weight:900;border-radius:8px;padding:3px 9px;background:#ede9fe;color:var(--pd)}
.av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;background:#ede9fe}
#hdr{position:absolute;top:44px;left:0;right:0;text-align:center;opacity:0}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const params=new URLSearchParams(location.search);const VID=params.get('v')||'a';
const stage=document.getElementById('stage');
const anims=[],ticks=[];
const EASE={out:'cubic-bezier(.16,1,.3,1)',back:'cubic-bezier(.34,1.56,.64,1)',io:'ease-in-out',lin:'linear'};
function A(e,kf,o){const a=e.animate(kf,Object.assign({fill:'both',easing:EASE.out},o));a.pause();anims.push(a);return a}
function mk(cls,html,parent){const d=document.createElement('div');d.className=cls;if(html!=null)d.innerHTML=html;(parent||stage).append(d);return d}
const KF={up:[{opacity:0,transform:'translateY(80px)'},{opacity:1,transform:'none'}],
 down:[{opacity:0,transform:'translateY(-80px)'},{opacity:1,transform:'none'}],
 pop:[{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'scale(1)'}],
 left:[{opacity:0,transform:'translateX(-160px)'},{opacity:1,transform:'none'}],
 right:[{opacity:0,transform:'translateX(160px)'},{opacity:1,transform:'none'}],
 fade:[{opacity:0},{opacity:1}],
 spin:[{opacity:0,transform:'scale(.2) rotate(-180deg)'},{opacity:1,transform:'scale(1) rotate(0)'}]};
function inAt(e,t,k='up',dur=650){A(e,KF[k],{delay:t*1000,duration:dur,easing:(k==='pop'||k==='spin')?EASE.back:EASE.out});return e}
function bob(e,amp=12,per=2400,ph=0){A(e,[{transform:'translateY(0)'},{transform:`translateY(${-amp}px)`},{transform:'translateY(0)'}],{duration:per,iterations:Infinity,easing:EASE.io,delay:-ph*1000})}
function pulse(e,per=900){A(e,[{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:per,iterations:Infinity,easing:EASE.io})}
function grow(e,t,dur=900,to=1){A(e,[{transform:'scaleX(0)'},{transform:`scaleX(${to})`}],{delay:t*1000,duration:dur})}
function scene(s,e,cls,build){
  const sc=mk('scene '+(cls||''));
  const D=(e-s)*1000,f=Math.min(260,D/4)/D;
  A(sc,[{opacity:0,offset:0},{opacity:1,offset:f},{opacity:1,offset:1-f},{opacity:0,offset:1}],{delay:s*1000,duration:D,easing:'linear'});
  build(sc,s);return sc}
function T(parent,cls,html,t,k='up'){const d=mk('t '+cls,html,parent);inAt(d,t,k);return d}

// background dots
for(let i=0;i<9;i++){const d=mk('dot');const s=60+((i*47)%140);d.style.cssText=`width:${s}px;height:${s}px;left:${(i*83)%540-30}px;top:${(i*131)%960}px`;
  A(d,[{transform:'translateY(0)'},{transform:`translateY(${i%2?-70:70}px)`},{transform:'translateY(0)'}],{duration:6000+i*500,iterations:Infinity,easing:EASE.io})}
// persistent header logo
const hdr=mk('','<div class="logo" style="font-size:34px;opacity:.95">BOAKO<span style="font-size:15px;letter-spacing:2px;margin-left:8px;font-weight:700;color:#ddd6fe;vertical-align:middle">ARCHIVE</span></div>');hdr.id='hdr';
</script>
<script>
function buildA(){
// 0-3 hook
scene(0,3,'mid',(s,t)=>{
  const e=mk('emo big','📋',s);e.style.marginBottom='10px';inAt(e,t+.1,'pop');
  T(s,'t1','보드게임 전적,<br><span class="hl">어디에 쌓고 계세요?</span>',t+.4)});
// 3-6 logo
scene(3,6,'mid',(s,t)=>{
  const l=mk('logo','BOAKO',s);l.style.fontSize='120px';inAt(l,t+.1,'pop');
  const l2=mk('t t3','ARCHIVE',s);l2.style.letterSpacing='10px';inAt(l2,t+.5,'up');
  const p=mk('sub','내 보드게임 기록을 한 곳에 모으는<br>보드게임 아레나 아카이브',s);inAt(p,t+.9,'up')});
hdr&&A(hdr,[{opacity:0},{opacity:1}],{delay:6000,duration:300});
// 6-10 recorder
scene(6,10,'',(s,t)=>{
  T(s,'t2','<span class="hl">🧩 기록기</span> 하나면<br>전적이 알아서 쌓여요',t);
  const c=mk('card','',s);c.style.marginTop='34px';
  c.innerHTML=`<div class="row" style="margin-bottom:12px"><b style="font-size:21px">📋 전적기록</b><span class="tag" style="margin-left:auto">자동 기록</span></div>`;
  inAt(c,t+.5,'up');
  [['스플렌더','🥇 1위','+12'],['윙스팬','🥈 2위','+6'],['카탄','🥇 1위','+10']].forEach((r,i)=>{
    const d=mk('row',`<div class="av" style="width:46px;height:46px;font-size:22px">🎲</div><b style="font-size:21px">${r[0]}</b><span style="margin-left:auto;font-weight:700">${r[1]}</span><b style="color:var(--p);font-size:20px;width:84px;text-align:right;white-space:nowrap">${r[2]} RP</b>`,c);
    d.style.cssText='padding:10px 0;border-top:1px solid var(--bd)';inAt(d,t+1.1+i*.45,'right')});
  const n=mk('note','※ 화면은 예시입니다',s)});
// 10-14 ranking
scene(10,14,'',(s,t)=>{
  T(s,'t2','<span class="hl">🏆 랭킹</span>으로<br>실력을 증명하세요',t);
  const c=mk('card','',s);c.style.marginTop='34px';inAt(c,t+.4,'up');
  [['보드왕','👑',100],['주사위장인','🥈',82],['카탄러버','🥉',66],['윙스팬러','4',48],['뉴비탈출','5',30]].forEach((r,i)=>{
    const d=mk('',`<div class="row"><div style="width:34px;font-size:24px;font-weight:900;text-align:center" class="emo">${r[1]}</div><b style="font-size:19px;width:104px">${r[0]}</b><div class="bar" style="flex:1"><i style="width:100%"></i></div></div>`,c);
    d.style.padding='9px 0';const bar=d.querySelector('i');bar.style.width=r[2]+'%';grow(bar,t+.9+i*.25,900);inAt(d,t+.6+i*.2,'left')});
  mk('note','※ 화면은 예시입니다',s)});
// 14-18 rival
scene(14,18,'',(s,t)=>{
  T(s,'t2','<span class="hl">⚡ 라이벌 매치</span><br>1:1 도전장을 던져!',t);
  const c=mk('card','',s);c.style.marginTop='36px';
  c.innerHTML=`<div class="row" style="justify-content:space-around"><div style="text-align:center"><div class="av" style="margin:auto;background:#ddd6fe">😎</div><b style="font-size:18px">도전자</b></div><div class="emo" style="font-size:54px">⚡</div><div style="text-align:center"><div class="av" style="margin:auto;background:#fde68a">🦊</div><b style="font-size:18px">라이벌</b></div></div><div style="text-align:center;margin-top:16px;font-weight:700;color:var(--sub);font-size:18px">이기면 포인트 보상!<br>응원(승자 예측)만 해도 포인트가 쌓여요</div>`;
  inAt(c,t+.5,'pop');const v=c.querySelector('.emo');pulse(v,700)});
// 18-22 achievements
scene(18,22,'',(s,t)=>{
  T(s,'t2','<span class="hl">🎖️ 업적</span>을 모으고<br>첫 승리를 기록해요',t);
  const g=mk('',null,s);g.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:34px';
  [['🥇','첫 승리'],['🔥','연승'],['🎯','도전자'],['🏅','업적'],['👑','챔피언'],['🌟','레전드']].forEach((b,i)=>{
    const d=mk('card',`<div class="emo" style="font-size:46px;text-align:center">${b[0]}</div><div style="text-align:center;font-weight:900;font-size:16px;margin-top:4px">${b[1]}</div>`,g);d.style.padding='16px 6px';inAt(d,t+.4+i*.2,'pop')});
  const p=mk('pill','🎲 오늘의 주사위 · 하루 1회 무료',s);p.style.marginTop='26px';p.style.fontSize='19px';inAt(p,t+1.8,'up')});
// 22-26 team & schedule
scene(22,26,'',(s,t)=>{
  T(s,'t2','팀을 만들고,<br><span class="hl">일정도 한눈에</span>',t);
  const w=mk('',null,s);w.style.cssText='display:flex;flex-direction:column;gap:14px;width:100%;margin-top:32px';
  [['🛡️','팀 창단','내 팀을 직접 만들어요'],['👥','팀 목록','팀을 찾아서 합류해요'],['📅','일정표','카카오톡 캘린더로 알림까지']].forEach((r,i)=>{
    const d=mk('card',`<div class="row"><div class="emo" style="font-size:40px">${r[0]}</div><div><b style="font-size:24px">${r[1]}</b><div style="color:var(--sub);font-weight:700;font-size:16px">${r[2]}</div></div></div>`,w);d.style.padding='16px 20px';inAt(d,t+.4+i*.35,'left')})});
// 26-30 together & tournament
scene(26,30,'',(s,t)=>{
  T(s,'t2','<span class="hl">🤝 같이 하자</span> · <span class="hl">🏅 토너먼트</span><br>같이 놀 사람, 여기 있어요',t);
  const c1=mk('card',`<div class="row"><b style="font-size:22px">🤝 같이 하자</b><span class="tag" style="margin-left:auto">모집중</span></div><div style="margin:10px 0 8px;font-weight:700;color:var(--sub)">오늘 밤 윙스팬 한 판?</div><div class="bar"><i style="width:50%"></i></div><div style="text-align:right;font-weight:900;color:var(--p);margin-top:4px">2 / 4명</div>`,s);
  c1.style.marginTop='30px';inAt(c1,t+.5,'left');
  const c2=mk('card',`<div class="row"><b style="font-size:22px">🏅 토너먼트</b><span class="tag" style="margin-left:auto;background:#fef3c7;color:#b45309">개최 공지</span></div><div style="margin-top:10px;font-weight:700;color:var(--sub)">개최 요청 · 종목 투표 · 일정 공지</div>`,s);
  c2.style.marginTop='16px';inAt(c2,t+1.1,'right')});
// 30-34 shop
scene(30,34,'',(s,t)=>{
  T(s,'t2','활동하면 포인트가 쌓이고<br><span class="hl">🛒 포인트 샵</span>에서 사용!',t);
  const g=mk('',null,s);g.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:34px';
  ['🎖️','🏵️','🎀','🧢','💎','🔮'].forEach((e,i)=>{const d=mk('card',`<div class="emo" style="font-size:44px;text-align:center">${e}</div><div style="text-align:center;margin-top:6px"><span class="tag">배지</span></div>`,g);d.style.padding='14px 6px';inAt(d,t+.4+i*.15,'pop')});
  const p=mk('pill pu','게시글 · 라이벌전 · 업적 → 포인트 적립',s);p.style.cssText+=';margin-top:26px;font-size:17px';inAt(p,t+1.6,'up');
  mk('note','※ 화면은 예시입니다',s)});
// 34-40 CTA
scene(34,40.001,'mid',(s,t)=>{
  const l=mk('logo','BOAKO',s);l.style.fontSize='104px';inAt(l,t+.1,'pop');
  T(s,'t2','보드게임 기록의 모든 것',t+.5);
  const u=mk('pill wh','boakoarchive.co.kr',s);u.style.cssText+=';margin-top:30px;font-size:26px';inAt(u,t+1,'up');pulse(u,1000);
  const p=mk('pill','🏁 11월 1일 팀 리그 개막!',s);p.style.marginTop='20px';inAt(p,t+1.6,'up')});
}

function buildB(){
// 0-4 date hook
scene(0,4,'mid',(s,t)=>{
  const a=mk('t t3','BOAKO 팀 리그',s);a.style.letterSpacing='4px';inAt(a,t+.1,'down');
  const d=mk('t','<span class="hl">11/1</span>',s);d.style.fontSize='170px';d.style.lineHeight='1.05';inAt(d,t+.4,'pop');
  T(s,'t1','드디어 개막!',t+1.2,'up');
  const e=mk('emo','🏆',s);e.style.fontSize='60px';e.style.marginTop='10px';inAt(e,t+1.9,'spin')});
// 4-8 team size
scene(4,8,'',(s,t)=>{
  T(s,'t1','팀원이 없어도<br><span class="hl">괜찮아요!</span>',t);
  const g=mk('',null,s);g.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;margin-top:40px';
  ['😎','❓','❓','❓'].forEach((e,i)=>{const d=mk('card',`<div class="emo" style="font-size:42px;text-align:center">${e}</div><div style="text-align:center;font-size:13px;font-weight:900;color:${i?'var(--sub)':'var(--p)'};margin-top:4px">${i?'모집중':'팀장'}</div>`,g);d.style.padding='16px 4px';if(i)d.style.opacity='.9';inAt(d,t+.5+i*.2,'pop')});
  const p=mk('pill','1명부터 창단 OK · 4명이 한 팀',s);p.style.marginTop='34px';inAt(p,t+1.7,'up')});
// 8-13 how to join
scene(8,13,'',(s,t)=>{
  T(s,'t2','팀 가입은<br><span class="hl">두 가지 방법</span>',t);
  const c1=mk('card',`<div class="row"><div class="emo" style="font-size:46px">🛡️</div><div><span class="tag">방법 ①</span><div style="font-size:26px;font-weight:900;margin-top:2px">팀 창단 메뉴</div><div style="color:var(--sub);font-weight:700;font-size:16px">내가 팀장이 되어 직접 창단</div></div></div>`,s);
  c1.style.marginTop='34px';inAt(c1,t+.6,'left');
  const c2=mk('card',`<div class="row"><div class="emo" style="font-size:46px">👥</div><div><span class="tag" style="background:#fef3c7;color:#b45309">방법 ②</span><div style="font-size:26px;font-weight:900;margin-top:2px">팀 목록</div><div style="color:var(--sub);font-weight:700;font-size:16px">마음에 드는 팀을 찾아 합류</div></div></div>`,s);
  c2.style.marginTop='18px';inAt(c2,t+1.6,'right');
  const u=mk('pill pu','BOAKO ARCHIVE 상단 메뉴에서!',s);u.style.cssText+=';margin-top:28px;font-size:18px';inAt(u,t+2.8,'up')});
// 13-16 bingo
function lc(s,t,emo,name,desc,vis){
  T(s,'t3','<span class="hl">팀 리그 전용 콘텐츠</span>',t,'down');
  const e=mk('t t1',`<span class="emo">${emo}</span> ${name}`,s);e.style.marginTop='8px';inAt(e,t+.2,'pop');
  const c=mk('card','',s);c.style.marginTop='24px';vis(c,t+.5);inAt(c,t+.4,'up');
  const d=mk('sub',desc,s);d.style.fontSize='21px';inAt(d,t+1.2,'up')}
scene(13,16,'',(s,t)=>lc(s,t,'🎲','팀 빙고 쟁탈전','25개 게임 칸을 차지하고<br>빙고줄을 완성하라!',(c,t0)=>{
  const g=mk('grid5','',c);const on=[0,1,2,6,7,12,13,18,24],on2=[3,8,17];
  for(let i=0;i<25;i++){const d=mk('cell'+(on.includes(i)?' on':on2.includes(i)?' on2':''),on.includes(i)||on2.includes(i)?'':String(i+1),g);
    if(on.includes(i)||on2.includes(i)){const k=on.indexOf(i);A(d,[{background:'#ede9fe',transform:'scale(1)'},{transform:'scale(1.18)'},{background:on2.includes(i)?'#f59e0b':'#7c3aed',transform:'scale(1)'}],{delay:(t0+.2+(k<0?on.length:k)*.12)*1000,duration:500,easing:EASE.back})
      d.style.color='#fff'}}
}));
// 16-19 drewa
scene(16,19,'',(s,t)=>lc(s,t,'🔥','드루와! 챌린지','"야, 너네 나와!"<br>팀 대 팀 도전장 한판 승부',(c,t0)=>{
  c.innerHTML=`<div class="row" style="justify-content:space-around"><div style="text-align:center"><div class="av" style="margin:auto;width:84px;height:84px;font-size:46px;background:#ddd6fe">🛡️</div><b style="font-size:20px">공격팀</b></div><div id="vs" class="emo" style="font-size:60px">⚔️</div><div style="text-align:center"><div class="av" style="margin:auto;width:84px;height:84px;font-size:46px;background:#fde68a">🏰</div><b style="font-size:20px">방어팀</b></div></div><div style="text-align:center;margin-top:12px;font-weight:900;color:var(--p);font-size:20px">"드루와 드루와~!"</div>`;
  pulse(c.querySelector('#vs'),600)}));
// 19-22 champion
scene(19,22,'',(s,t)=>lc(s,t,'👑','챔피언','종목별로 최고의 팀이<br>챔피언으로 기록돼요',(c,t0)=>{
  [['스플렌더','👑'],['윙스팬','👑'],['카탄','👑']].forEach((r,i)=>{
    const d=mk('row',`<div class="emo" style="font-size:34px">${r[1]}</div><b style="font-size:22px">${r[0]}</b><span class="tag" style="margin-left:auto">챔피언</span>`,c);d.style.padding='11px 0';if(i)d.style.borderTop='1px solid var(--bd)';inAt(d,t0+.2+i*.3,'left')})}));
// 22-25 KOL

hdr.style.opacity=0;A(hdr,[{opacity:0},{opacity:1}],{delay:4000,duration:300});
